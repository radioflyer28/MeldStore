name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s3:
    name: RustFS S3-compatible qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.3'
          python-version: '3.12'
      - name: Install managed Python and all locked extras
        run: |
          uv python install
          uv sync --frozen --all-extras --python-preference only-managed
      - name: Disposable real RustFS server, lifecycle and memory qualification
        run: uv run --frozen --all-extras python tools/s3_lab.py
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.3'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install managed Python and locked dependencies
        run: |
          uv python install
          uv sync --frozen --extra test --python-preference only-managed
      - name: Runtime evidence
        run: uv run --frozen python -c "import sys, sqlite3; print(sys.version); print('SQLite', sqlite3.sqlite_version)"
      - name: Both catalog adapters
        run: uv run --frozen --extra test pytest
      - name: Every optional format handler
        run: uv run --frozen --all-extras pytest
      - name: Lint
        run: uv run --frozen --extra test ruff check .
      - name: Build wheel and sdist
        run: uv build
      - name: Clean wheel and sdist installation smoke tests
        run: uv run --frozen python tools/package_smoke.py
      - name: Clean wheel and sdist optional handler smoke tests
        run: uv run --frozen python tools/package_smoke.py --formats
