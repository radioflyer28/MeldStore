[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "meldstore"
version = "0.1.0rc1"
description = "Generic blob storage with portable relational metadata"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "melddb @ git+https://github.com/radioflyer28/melddb.git@adfc87fb9933412e67a2d4b7de316cd6db552d9c",
    "obstore>=0.11,<0.12",
    "xxhash>=3.5,<4",
]

[project.urls]
Repository = "https://github.com/radioflyer28/MeldStore"
Documentation = "https://github.com/radioflyer28/MeldStore/blob/main/README.md"
Issues = "https://github.com/radioflyer28/MeldStore/issues"

[project.optional-dependencies]
parquet = ["pandas>=2.2,<4", "pyarrow>=19,<24"]
arrow = ["pyarrow>=19,<24"]
polars = ["polars>=1.30,<2"]
numpy = ["numpy>=2.2,<3"]
blosc2 = ["numpy>=2.2,<3", "blosc2>=3,<4"]
test = ["pytest>=8", "ruff>=0.12", "build>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
