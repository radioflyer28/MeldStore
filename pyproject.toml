[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "meldstore"
version = "0.0.0.dev0"
description = "Generic blob storage with portable relational metadata"
readme = "README.md"
requires-python = ">=3.12"
# Runtime dependencies are established and locked in S01; this is a scaffold.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.12", "build>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
